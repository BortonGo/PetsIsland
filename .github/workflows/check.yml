name: App checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: "1"
jobs:
  resources-and-release:
    name: Resources and release build
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      PET_REPORT_DIR: outputs/qa/check-resources-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-dev.txt
      - run: python3 -m pip install -r Tools/requirements-dev.txt
      - name: Validate CI helpers and resources
        timeout-minutes: 5
        run: bash Tools/check_project.sh resources
      - name: Build and analyze release
        timeout-minutes: 15
        run: bash Tools/check_project.sh release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-resources-release
          path: outputs/qa/check-*/
  unit-tests:
    name: Unit and StoreKit tests
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PET_REPORT_DIR: outputs/qa/check-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-dev.txt
      - run: python3 -m pip install -r Tools/requirements-dev.txt
      - name: Run every unit and StoreKit test
        timeout-minutes: 15
        run: bash Tools/check_project.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-unit
          path: outputs/qa/check-*/
  ui-tests:
    name: UI tests (${{ matrix.shard }}/6)
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PET_UI_SHARD: ${{ matrix.shard }}/6
      PET_REPORT_DIR: outputs/qa/check-ui-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-dev.txt
      - run: python3 -m pip install -r Tools/requirements-dev.txt
      - name: Run UI shard with live test progress
        timeout-minutes: 20
        run: bash Tools/check_project.sh ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-ui-${{ matrix.shard }}
          path: outputs/qa/check-*/
  # Preserve the existing check name for branch protection and a single result.
  tests-and-resources:
    needs: [resources-and-release, unit-tests, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESOURCES_RESULT: ${{ needs.resources-and-release.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: |
          for result in "$RESOURCES_RESULT" "$UNIT_RESULT" "$UI_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "A required check failed, was cancelled or was skipped. See the individual job logs."
              exit 1
            fi
          done
