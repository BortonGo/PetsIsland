name: App checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-resources:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r Tools/requirements-dev.txt
      - run: bash Tools/check_project.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: outputs/qa/check-*/
